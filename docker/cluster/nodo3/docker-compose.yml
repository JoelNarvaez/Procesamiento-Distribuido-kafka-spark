services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka-nodo3
    hostname: kafka-nodo3
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://192.168.1.67:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@192.168.1.65:9093,2@192.168.1.66:9093,3@192.168.1.67:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data

  # Spark Worker 2.
  # network_mode: host -> el worker se enlaza directamente a la IP de la LAN
  # (192.168.1.67) y abre los puertos aleatorios de los executors sobre la red
  # real, de modo que el driver (en el master) puede comunicarse de regreso.
  # Esto SOLO funciona en Linux; por eso este nodo corre en una VM Ubuntu.
  spark-worker:
    image: apache/spark:latest
    container_name: spark-worker-2-cluster
    hostname: spark-worker-2
    network_mode: host
    user: root
    environment:
      SPARK_LOCAL_IP: 192.168.1.67
      SPARK_PUBLIC_DNS: 192.168.1.67
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://192.168.1.65:7077
      --host 192.168.1.67
      --port 7078
      --webui-port 8081
    volumes:
      - ../../../data:/opt/spark/data
      - ../../../spark/jobs:/opt/spark/jobs
      - ../../../spark/output:/opt/spark/output
      - ../../../spark/jars/mysql-connector-j-8.0.33.jar:/opt/spark/jars/mysql-connector-j-8.0.33.jar

volumes:
  kafka_data:
