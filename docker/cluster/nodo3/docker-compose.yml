services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka-nodo3
    hostname: kafka-nodo3
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://100.87.252.100:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@100.124.245.95:9093,2@100.126.190.35:9093,3@100.87.252.100:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data

  spark-worker:
    image: apache/spark:latest
    container_name: spark-worker-2-cluster
    hostname: spark-worker-2
    network_mode: host
    user: root
    environment:
      SPARK_LOCAL_IP: 100.87.252.100
      SPARK_PUBLIC_DNS: 100.87.252.100
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://100.124.245.95:7077
      --host 100.87.252.100
      --port 7078
      --webui-port 8081
    volumes:
      - ../../../data:/opt/spark/data
      - ../../../spark/jobs:/opt/spark/jobs
      - ../../../spark/output:/opt/spark/output
      - ../../../spark/jars/mysql-connector-j-8.0.33.jar:/opt/spark/jars/mysql-connector-j-8.0.33.jar

volumes:
  kafka_data:
